name: Simple CI pipeline

on: [push]          # fire on every push; adjust as needed

jobs:
  pipeline:
    runs-on: ubuntu-latest

    env:                           # Define environment variables for the job
      PRINTLEMEDI: "your_value_here"  # Replace with the actual value

    steps:
      - name: Checkout code             # (optional but common)
        uses: actions/checkout@v4

      - name: Build
        run: echo "Build step"

      - name: Test
        run: echo "Test step"

      - name: Deploy
        env:                           # Define environment variables for this step
          usePassword: ${{ secrets.USE_PASSWORD }}  # Securely fetch from GitHub Secrets
        run: |
          echo "Deploy step"
          echo "PRINTLEMEDI: $PRINTLEMEDI"
          echo "usePassword: $usePassword"